[package]
name = "clash-kde"
version = "1.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Per-user mihomo session service for the KDE System Settings module"

[dependencies]
base64 = "0.22"
caps = "0.5"
bytes = "1"
dirs = "6"
futures-util = "0.3"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
